name: Build & Push Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version string baked into the image (SUBLARR_VERSION env, OCI version
          label) and used as an additional image tag, e.g. 1.13.4-rc.4.
          Leave empty for a plain branch/sha build without a version.
        required: false
        default: ''

# Tag pushes (releases) are handled by release.yml, not here.

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build${{ github.event_name != 'pull_request' && ' & Push' || '' }} Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=rc-latest,enable=${{ contains(inputs.version, '-rc.') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Docker Hub only carries the moving :rc-latest for release candidates;
      # the immutable -rc.N tags stay on GHCR. Finals are mirrored by release.yml.
      - name: Mirror rc-latest to Docker Hub
        if: contains(inputs.version, '-rc.') && env.DOCKERHUB_TOKEN != ''
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login docker.io -u abrechen2 --password-stdin
          docker buildx imagetools create \
            -t docker.io/abrechen2/sublarr:rc-latest \
            "${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]'):rc-latest"
