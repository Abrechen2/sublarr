name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

# Cancel in-progress runs for the same branch/PR — saves CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Detect which parts of the codebase changed ──────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'requirements*.txt'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # ─── Backend ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python 3.12)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: ./backend
        run: ruff check .

      - name: Format check (ruff)
        working-directory: ./backend
        run: ruff format --check .

      - name: Lint (is_safe_path arg-order)
        working-directory: ./backend
        run: |
          python tools/test_lint_is_safe_path.py
          python tools/lint_is_safe_path.py

      - name: Lint (no new env-loadable fields — UI-first convention)
        working-directory: ./backend
        run: |
          python tools/test_lint_no_new_env_fields.py
          python tools/lint_no_new_env_fields.py

      - name: Lint (no routes imports in services — layering)
        working-directory: ./backend
        run: |
          python tools/test_lint_no_routes_import_in_services.py
          python tools/lint_no_routes_import_in_services.py

      - name: Type check (mypy)
        working-directory: ./backend
        run: mypy . --config-file mypy.ini
        continue-on-error: true  # informational — not yet enforced

      - name: Tests (pytest)
        working-directory: ./backend
        run: |
          pytest --tb=short -q \
            --ignore=tests/performance \
            --ignore=tests/integration/test_translator_pipeline.py \
            --ignore=tests/integration/test_provider_pipeline.py \
            --ignore=tests/test_video_sync.py \
            --ignore=tests/test_translation_backends.py \
            --ignore=tests/test_wanted_search_reliability.py \
            -k "not (test_sonarr_download_webhook or test_radarr_download_webhook or test_parse_llm_response_too_many_merge or test_record_backend_success)"

  # ─── Frontend ─────────────────────────────────────────────────────────────
  # Node 24, not the 26 the Dockerfile builds with: on Node 26 jsdom leaves
  # `window.localStorage` undefined, so every test touching storage dies with
  # "Cannot read properties of undefined". Reproduced on jsdom 29 and 30 alike,
  # so it is the runtime, not the bump. Raise this to 26 once that clears.
  frontend:
    name: Frontend (Node 24)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: ./frontend
        run: npm run lint

      - name: Type check (tsc)
        working-directory: ./frontend
        # -b builds all referenced projects; bare --noEmit on the solution-style
        # root tsconfig (files: []) checks nothing.
        run: npx tsc -b

      - name: Tests (vitest)
        working-directory: ./frontend
        run: npm run test -- --run

  # ─── Security ─────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit[sarif]

      # Audits requirements.txt, not the ambient environment. Auditing the
      # installed env dragged in pip/setuptools/build-tool noise that had
      # nothing to do with what Sublarr ships.
      #
      # PYSEC-2026-3447 (setuptools, CVE-2026-59890) is ignored deliberately:
      # it only affects building an sdist with MANIFEST.in exclude directives,
      # which Sublarr never does, and the fix (83.0.0) is out of reach because
      # requirements.txt pins setuptools<81 so ffsubsync's webrtcvad fallback
      # keeps working (84aac466). Remove this ignore when that pin lifts.
      - name: pip-audit (CVE check)
        working-directory: ./backend
        run: pip-audit -r requirements.txt --desc --ignore-vuln PYSEC-2026-3447

      # Scope + suppressions live in backend/.bandit, shared with pre-commit.
      # The gate is HIGH severity at HIGH confidence; everything below that is
      # reported into the Security tab via SARIF rather than blocking a push.
      - name: bandit (static security — gate)
        working-directory: ./backend
        run: bandit -r . --ini .bandit --severity-level high --confidence-level high

      - name: bandit (full report → SARIF)
        if: always()
        working-directory: ./backend
        run: bandit -r . --ini .bandit -f sarif -o bandit.sarif || true

      - name: Upload bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/bandit.sarif
          category: bandit

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: ./frontend
        run: npm ci

      # --omit=dev on purpose: the shipped bundle is production dependencies.
      # The dev tree carries known advisories through the Lighthouse CI
      # toolchain that never reach a user's browser.
      - name: npm audit (CVE check — production deps)
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (dev deps — report only)
        if: always()
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

  # ─── Semgrep (deeper static analysis) ─────────────────────────────────────
  # Reports into the Security tab rather than blocking. It is new here; making
  # it a gate before we have seen its baseline would just teach us to ignore a
  # red check. Promote to blocking once the findings are triaged.
  semgrep:
    name: Semgrep
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7

      - name: Run Semgrep
        run: semgrep scan --config p/default --config p/python --config p/typescript --sarif --output semgrep.sarif --exclude backend/venv --exclude backend/providers/_vendor --exclude frontend/node_modules
        continue-on-error: true

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ─── Trivy (dependency + container surface) ───────────────────────────────
  # Sublarr ships a Docker image and never scanned it. This scans the repo
  # filesystem (lockfiles + Dockerfile) — the image itself is scanned in
  # docker-build.yml where it is actually built.
  trivy:
    name: Trivy
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          skip-dirs: backend/venv,backend/providers/_vendor,frontend/node_modules
        continue-on-error: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy
