name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:
    # In a called workflow github.event_name is the caller's event ("push" for
    # a release tag), never "workflow_call", so the release asks for the full
    # run explicitly; the paths filter sees no changes on a tag.
    inputs:
      full:
        type: boolean
        default: false

# Least privilege for every job: none of them writes to the repository.
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR — saves CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Detect which parts of the codebase changed ──────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'requirements*.txt'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # ─── Backend ─────────────────────────────────────────────────────────────
  # The suite runs as four parallel shards (PYTEST_SHARD, see tests/conftest.py):
  # one 4-core runner took 45 min for it. Lint and type checks run once, on
  # shard 1. The job branch protection requires is the aggregate below.
  backend-tests:
    name: Backend tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PYTEST_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        if: matrix.shard == 1
        working-directory: ./backend
        run: ruff check .

      - name: Format check (ruff)
        if: matrix.shard == 1
        working-directory: ./backend
        run: ruff format --check .

      - name: Lint (is_safe_path arg-order)
        if: matrix.shard == 1
        working-directory: ./backend
        run: |
          python tools/test_lint_is_safe_path.py
          python tools/lint_is_safe_path.py

      - name: Lint (no new env-loadable fields — UI-first convention)
        if: matrix.shard == 1
        working-directory: ./backend
        run: |
          python tools/test_lint_no_new_env_fields.py
          python tools/lint_no_new_env_fields.py

      - name: Lint (no routes imports in services — layering)
        if: matrix.shard == 1
        working-directory: ./backend
        run: |
          python tools/test_lint_no_routes_import_in_services.py
          python tools/lint_no_routes_import_in_services.py

      - name: Type check (mypy)
        if: matrix.shard == 1
        working-directory: ./backend
        run: mypy . --config-file mypy.ini
        continue-on-error: true  # informational — not yet enforced

      # -n auto (pytest-xdist, already in requirements-dev.txt): the serial run
      # takes ~50 min on a runner while `concurrency.cancel-in-progress` kills it
      # on the next push to master. Six consecutive commits (18e64fa8..a42dcae1)
      # never produced a completed backend run for exactly that reason.
      - name: Tests (pytest)
        working-directory: ./backend
        run: |
          pytest --tb=short -q -n auto \
            --ignore=tests/performance \
            --ignore=tests/integration/test_translator_pipeline.py \
            --ignore=tests/integration/test_provider_pipeline.py \
            --ignore=tests/test_video_sync.py \
            --ignore=tests/test_translation_backends.py \
            --ignore=tests/test_wanted_search_reliability.py \
            -k "not (test_sonarr_download_webhook or test_radarr_download_webhook or test_parse_llm_response_too_many_merge or test_record_backend_success)"

  # The check branch protection requires, by this exact name. It passes only
  # when every shard passed, and is skipped exactly when the shards are.
  backend:
    name: Backend (Python 3.12)
    needs: [changes, backend-tests]
    if: always() && (needs.changes.outputs.backend == 'true' || inputs.full)
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: test "${{ needs.backend-tests.result }}" = success

  # ─── Frontend ─────────────────────────────────────────────────────────────
  # Node 24, not the 26 the Dockerfile builds with: on Node 26 jsdom leaves
  # `window.localStorage` undefined, so every test touching storage dies with
  # "Cannot read properties of undefined". Reproduced on jsdom 29 and 30 alike,
  # so it is the runtime, not the bump. Raise this to 26 once that clears.
  frontend:
    name: Frontend (Node 24)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: ./frontend
        run: npm run lint

      - name: Type check (tsc)
        working-directory: ./frontend
        # -b builds all referenced projects; bare --noEmit on the solution-style
        # root tsconfig (files: []) checks nothing.
        run: npx tsc -b

      - name: Tests (vitest)
        working-directory: ./frontend
        run: npm run test -- --run

  # ─── Security ─────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      # Audits requirements.txt, not the ambient environment. Auditing the
      # installed env dragged in pip/setuptools/build-tool noise that had
      # nothing to do with what Sublarr ships.
      - name: pip-audit (CVE check)
        working-directory: ./backend
        run: pip-audit -r requirements.txt --desc

      # Scope + suppressions live in backend/.bandit, shared with pre-commit.
      # The gate is HIGH severity at HIGH confidence. Nothing is uploaded to
      # GitHub code scanning: the report step below prints MEDIUM and above
      # into this job's log. LOW findings (subprocess imports, try/except/pass)
      # are bandit's informational class and stay out of the log on purpose.
      - name: bandit (static security — gate)
        working-directory: ./backend
        run: bandit -r . --ini .bandit --severity-level high --confidence-level high

      - name: bandit (medium+ report — log only)
        if: always()
        working-directory: ./backend
        run: bandit -r . --ini .bandit --severity-level medium || true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: ./frontend
        run: npm ci

      # --omit=dev on purpose: the shipped bundle is production dependencies.
      # The dev tree carries known advisories through the Lighthouse CI
      # toolchain that never reach a user's browser.
      - name: npm audit (CVE check — production deps)
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (dev deps — report only)
        if: always()
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

  # ─── Semgrep (deeper static analysis) ─────────────────────────────────────
  # Report only, into this job's log; nothing is uploaded to GitHub code
  # scanning. Its baseline is dominated by audit rules (raw SQL in migrations,
  # dynamic urllib) that are reviewed false positives, so a blocking Semgrep
  # would be a red check people learn to click past. Tests, vendored and
  # sha256-pinned catalog code are not ours to fix and are excluded.
  semgrep:
    name: Semgrep
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7

      - name: Run Semgrep (report only)
        run: >-
          semgrep scan --config p/default --config p/python --config p/typescript
          --exclude backend/venv
          --exclude backend/tests
          --exclude backend/providers/_vendor
          --exclude backend/providers/hub/bundles
          --exclude frontend/node_modules
          --exclude 'frontend/src/**/__tests__'
        continue-on-error: true

  # ─── Trivy (dependency + container surface) ───────────────────────────────
  # Sublarr ships a Docker image and never scanned it. This scans the repo
  # filesystem (lockfiles + Dockerfile) — the image itself is scanned in
  # docker-build.yml where it is actually built. Report only, as a table in
  # this job's log: a CVE published overnight in a transitive dependency must
  # not block an unrelated push. npm audit and pip-audit above are the gates.
  trivy:
    name: Trivy
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem scan (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          skip-dirs: backend/venv,backend/providers/_vendor,frontend/node_modules
        continue-on-error: true
