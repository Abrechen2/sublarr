name: Discord Release Announcer

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post release embed to Discord
        env:
          WEBHOOK_CHANGELOG: ${{ secrets.DISCORD_WEBHOOK_CHANGELOG }}
          WEBHOOK_ANNOUNCEMENTS: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCEMENTS }}
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ github.event.release.name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
          IS_PRE: ${{ github.event.release.prerelease }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          AUTHOR: ${{ github.event.release.author.login }}
          AUTHOR_AVATAR: ${{ github.event.release.author.avatar_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          body = os.environ.get("BODY", "") or "_(no release notes)_"
          # Discord embed description cap is 4096 chars
          if len(body) > 4000:
              body = body[:3997] + "..."

          is_pre = os.environ.get("IS_PRE", "false").lower() == "true"
          color = 0xFFCC00 if is_pre else 0x57F287  # yellow for prerelease, green for latest

          tag = os.environ["TAG"]
          name = os.environ.get("NAME") or tag
          prefix = "🧪 Release Candidate" if is_pre else "📦 Release"

          payload = {
              "username": "Sublarr Release Bot",
              "avatar_url": os.environ.get("AUTHOR_AVATAR") or None,
              "embeds": [{
                  "title": f"{prefix} · {name}",
                  "url": os.environ["URL"],
                  "description": body,
                  "color": color,
                  "footer": {"text": f"Sublarr · {tag}"},
                  "timestamp": os.environ["PUBLISHED_AT"],
                  "author": {
                      "name": os.environ.get("AUTHOR", "unknown"),
                      "icon_url": os.environ.get("AUTHOR_AVATAR") or None,
                  },
              }],
          }

          # ensure_ascii=False keeps em-dashes / emoji / accents as UTF-8
          # bytes instead of \uXXXX escapes — Discord renders both correctly,
          # but the raw form is human-readable in webhook delivery logs.
          data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          targets = []
          # Prereleases only land in #changelog; final releases land in both.
          if os.environ.get("WEBHOOK_CHANGELOG"):
              targets.append(("WEBHOOK_CHANGELOG", os.environ["WEBHOOK_CHANGELOG"]))
          if not is_pre and os.environ.get("WEBHOOK_ANNOUNCEMENTS"):
              targets.append(("WEBHOOK_ANNOUNCEMENTS", os.environ["WEBHOOK_ANNOUNCEMENTS"]))

          if not targets:
              print("No Discord webhooks configured, nothing to do.")
              sys.exit(0)

          failures = []
          for label, url in targets:
              req = urllib.request.Request(
                  url,
                  data=data,
                  method="POST",
                  headers={
                      "Content-Type": "application/json; charset=utf-8",
                      # Cloudflare in front of discord.com blocks the default
                      # Python-urllib UA with HTTP 403 / code 1010.
                      "User-Agent": (
                          "Sublarr-Release-Bot "
                          "(https://github.com/abrechen2/sublarr, 1.0)"
                      ),
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      print(f"{label}: HTTP {resp.status}")
              except Exception as exc:
                  print(f"{label}: failed: {exc}")
                  failures.append(label)

          if failures:
              sys.exit(f"Discord delivery failed for: {', '.join(failures)}")
          PY
