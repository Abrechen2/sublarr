name: Release

# ─── Triggers ────────────────────────────────────────────────────────────────
# Automatic: push a tag like v0.12.1-beta or v1.0.0
# Manual:    workflow_dispatch with explicit version + toggles
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release — must match backend/VERSION exactly (e.g. 0.12.1-beta)'
        required: true
      skip_tests:
        description: 'Skip CI checks (use with caution)'
        type: boolean
        default: false
      push_docker:
        description: 'Push Docker image to GHCR'
        type: boolean
        default: true
      create_release:
        description: 'Create GitHub Release'
        type: boolean
        default: true

# Read-only by default; the docker and release jobs ask for the writes they
# need (packages, contents) themselves.
permissions:
  contents: read

# Only one release can run at a time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ─── 0. Gate ───────────────────────────────────────────────────────────────
  # Decides whether the workflow should run at all. Skips on:
  #   • RC tags (vX.Y.Z-...-rc.N) — the deploy skill handles RC build/push/release
  #     manually; CI rebuilding here would diverge from the bytes the human tested.
  #   • Final tags whose Docker image ALREADY exists on GHCR — never overwrite a
  #     published release image.
  # A final tag is the promotion: this workflow rebuilds the tested RC's commit
  # as :VERSION/:latest/:stable, so the image reports VERSION instead of the
  # -rc.N it was tested as (retagging the RC bytes kept SUBLARR_VERSION=X.Y.Z-rc.N
  # baked in for every self-hoster). The validate job refuses a tag that does
  # not sit on a commit that was built and pushed as an RC of this version.
  # workflow_dispatch always runs (manual emergency path).
  gate:
    name: Gate
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      reason:     ${{ steps.decide.outputs.reason }}
      version:    ${{ steps.decide.outputs.version }}
      tag:        ${{ steps.decide.outputs.tag }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
    steps:
      - name: Decide
        id: decide
        # The tag name and the dispatch input reach the script through env, not
        # ${{ }} interpolation, so they are data and never shell code. VERSION
        # is then held to a strict semver shape: every later job interpolates
        # this job's outputs, so this is the one place they get validated.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -e
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
          else
            VERSION="$INPUT_VERSION"
            TAG="v${VERSION}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "❌  '$VERSION' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # workflow_dispatch always runs — operator chose this explicitly.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip RC tags — deploy skill handles them manually.
          if [[ "$TAG" =~ -rc\.[0-9]+$ ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=rc-tag (deploy skill handles RC build/push/release)" >> "$GITHUB_OUTPUT"
            echo "ℹ️  Skipping: $TAG is an RC tag — deploy skill owns RC artefacts"
            exit 0
          fi

          # Skip if the GHCR Docker tag already exists — deploy skill already
          # promoted bytes; CI rebuild would silently clobber the tested image.
          IMAGE_LC="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if docker manifest inspect "$IMAGE_LC:$VERSION" >/dev/null 2>&1; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=image-already-on-ghcr (release image already published)" >> "$GITHUB_OUTPUT"
            echo "ℹ️  Skipping: $IMAGE_LC:$VERSION already exists on GHCR"
            echo "    Rebuilding here would replace a published release image."
            echo "    Use workflow_dispatch if a deliberate rebuild is required."
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "reason=tag-push, image not yet on GHCR" >> "$GITHUB_OUTPUT"
          echo "✅  Proceeding: image will be built fresh"

  # ─── 1. Validate ───────────────────────────────────────────────────────────
  validate:
    name: Validate version
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.gate.outputs.version }}
      tag:     ${{ needs.gate.outputs.tag }}
      prerelease: ${{ needs.gate.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7

      - name: Verify backend/VERSION matches
        run: |
          CURRENT=$(tr -d '[:space:]' < backend/VERSION)
          EXPECTED="${{ needs.gate.outputs.version }}"
          if [[ "$CURRENT" != "$EXPECTED" ]]; then
            echo "❌  backend/VERSION is '$CURRENT', expected '$EXPECTED'"
            echo "    Bump the version in backend/VERSION and push a new commit first."
            exit 1
          fi
          echo "✅  backend/VERSION = $CURRENT"

      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.gate.outputs.tag }}"
          if gh release view "$TAG" &>/dev/null 2>&1; then
            echo "❌  Release $TAG already exists. Aborting."
            exit 1
          fi
          echo "✅  Release $TAG does not exist yet"

      - name: Verify the tag sits on a tested RC
        # Promotion rebuilds this commit, so it must be the commit an RC of this
        # version was built from: every RC build pushes :sha-<short> with
        # SUBLARR_VERSION=<version>-rc.N baked in. workflow_dispatch skips it
        # (deliberate rebuilds, emergencies).
        if: github.event_name == 'push' && needs.gate.outputs.prerelease == 'false'
        run: |
          VERSION="${{ needs.gate.outputs.version }}"
          IMAGE_LC="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHORT="${GITHUB_SHA::7}"
          if ! docker buildx imagetools inspect "$IMAGE_LC:sha-$SHORT" >/dev/null 2>&1; then
            echo "❌  No image $IMAGE_LC:sha-$SHORT — this commit was never built as an RC."
            exit 1
          fi
          BAKED=$(docker buildx imagetools inspect "$IMAGE_LC:sha-$SHORT" --format '{{json .Image}}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); d=d.get('linux/amd64', d); print(next((e.split('=',1)[1] for e in d['config'].get('Env', []) if e.startswith('SUBLARR_VERSION=')), ''))")
          if [[ ! "$BAKED" =~ ^${VERSION//./\\.}-rc\.[0-9]+$ ]]; then
            echo "❌  $IMAGE_LC:sha-$SHORT reports '$BAKED', not an RC of $VERSION."
            exit 1
          fi
          echo "✅  $GITHUB_SHA was tested as $BAKED"

  # ─── 2. CI checks ─────────────────────────────────────────────────────────
  ci:
    name: CI checks
    needs: validate
    if: ${{ !inputs.skip_tests || github.event_name == 'push' }}
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  # ─── 3. Docker build & push ────────────────────────────────────────────────
  docker:
    name: Build & push Docker image
    needs: [validate, ci]
    # Run if validate passed AND (ci passed OR ci was skipped via input)
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Lowercase image name
        # GHCR requires lowercase — github.repository may contain uppercase owner
        run: echo "IMAGE_LC=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # push_docker input is only set for workflow_dispatch; for tag push always push
          push: ${{ github.event_name == 'push' || inputs.push_docker != false }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
          tags: |
            ${{ env.IMAGE_LC }}:${{ needs.validate.outputs.version }}
            ${{ env.IMAGE_LC }}:latest
            ${{ env.IMAGE_LC }}:stable
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3b. Docker Hub mirror ────────────────────────────────────────────────
  # Copies the pushed GHCR manifests to Docker Hub, which Unraid CA, Synology
  # and Portainer default to. A separate job so a Docker Hub hiccup never
  # blocks the GitHub release; rerun just this job if it fails.
  dockerhub:
    name: Mirror to Docker Hub
    needs: [validate, docker]
    if: |
      always() &&
      needs.docker.result == 'success' &&
      needs.validate.outputs.prerelease == 'false' &&
      (github.event_name == 'push' || inputs.push_docker != false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Skip without a Docker Hub token
        if: env.DOCKERHUB_TOKEN == ''
        run: echo "::warning::DOCKERHUB_TOKEN is not set; Docker Hub was not updated."

      - name: Set up Docker Buildx
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: abrechen2
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy the release tags
        if: env.DOCKERHUB_TOKEN != ''
        run: |
          SRC="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ needs.validate.outputs.version }}"
          DST=docker.io/abrechen2/sublarr
          docker buildx imagetools create \
            -t "$DST:${{ needs.validate.outputs.version }}" \
            -t "$DST:latest" \
            -t "$DST:stable" \
            "$SRC"
          test "$(docker buildx imagetools inspect "$DST:${{ needs.validate.outputs.version }}" --format '{{json .Manifest.Digest}}')" \
            = "$(docker buildx imagetools inspect "$SRC" --format '{{json .Manifest.Digest}}')"

  # ─── 4. GitHub Release ────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [validate, docker]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.docker.result == 'success' &&
      (github.event_name == 'push' || inputs.create_release != false)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog section
        id: notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          # Pull the section between ## [VERSION] and the next ## [
          NOTES=$(awk "
            /^## \[$VERSION\]/ { found=1; next }
            /^## \[/           { if (found) exit }
            found              { print }
          " CHANGELOG.md)

          if [[ -z "$NOTES" ]]; then
            NOTES="See CHANGELOG.md for details."
          fi

          # Write to file to avoid quoting issues
          echo "$NOTES" > /tmp/release-notes.md
          echo "notes_file=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          PRERELEASE="${{ needs.validate.outputs.prerelease }}"
          NOTES_FILE="${{ steps.notes.outputs.notes_file }}"

          PRERELEASE_FLAG=""
          if [[ "$PRERELEASE" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            --title "Sublarr $TAG" \
            --notes-file "$NOTES_FILE" \
            $PRERELEASE_FLAG
